<title>__PROJECT__ 项目地图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* A building guide drawn on drafting paper. The plan is one building with ink walls: wings carry a signage band,
   rooms carry a pictogram. Picking a room opens its sheet below: a signage header and a flow diagram.
   Left aligned throughout. Colour belongs to the wings; ink is for walls and words. */
:root{
  --paper:#f3f5f9; --dot:#cdd4e0; --sheet:#ffffff; --ink:#14213a; --muted:#57627a; --hair:#d3d9e4; --track:#dfe4ec;
  --warn:#c9470f; --on:#ffffff;
  --z0:#1e5bd8; --z0s:#e4edfd;
  --z1:#0a8765; --z1s:#dcf2ea;
  --z2:#d2501a; --z2s:#fce8dc;
  --z3:#7046cc; --z3s:#ebe5fa;
  --z4:#0d7887; --z4s:#dbf1f4;
  --z5:#b02a60; --z5s:#fae4ec;
  --f-text:"Barlow","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Barlow","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1422; --dot:#1f2b43; --sheet:#141d30; --ink:#e7ecf6; --muted:#97a3ba; --hair:#2a3651; --track:#27324b;
    --warn:#ff9a5c; --on:#0d1422;
    --z0:#78a2ff; --z0s:#172544; --z1:#55cba7; --z1s:#112e28; --z2:#ff9258; --z2s:#38210f;
    --z3:#b299ff; --z3s:#241d44; --z4:#62c9d6; --z4s:#102c31; --z5:#f28db2; --z5s:#351926; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1422; --dot:#1f2b43; --sheet:#141d30; --ink:#e7ecf6; --muted:#97a3ba; --hair:#2a3651; --track:#27324b;
  --warn:#ff9a5c; --on:#0d1422;
  --z0:#78a2ff; --z0s:#172544; --z1:#55cba7; --z1s:#112e28; --z2:#ff9258; --z2s:#38210f;
  --z3:#b299ff; --z3s:#241d44; --z4:#62c9d6; --z4s:#102c31; --z5:#f28db2; --z5s:#351926; color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px 60px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
code{font-family:var(--f-mono);font-size:.82em;background:var(--paper);border:1px solid var(--hair);padding:.05em .36em;border-radius:5px;overflow-wrap:anywhere}
p{margin:0}
.z0{--z:var(--z0);--zs:var(--z0s)} .z1{--z:var(--z1);--zs:var(--z1s)} .z2{--z:var(--z2);--zs:var(--z2s)}
.z3{--z:var(--z3);--zs:var(--z3s)} .z4{--z:var(--z4);--zs:var(--z4s)} .z5{--z:var(--z5);--zs:var(--z5s)}
.zx{--z:var(--muted);--zs:var(--track)} /* changed files that no part owns: they sit in no wing, so they take no wing's colour */
.pic{display:flex;align-items:center;justify-content:center;background:var(--z);color:var(--on);border-radius:8px;flex:none}

/* heading */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 28px;align-items:end}
.title{font-size:clamp(32px,5.2vw,56px);font-weight:900;line-height:1.04;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
.stamp{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sum{font-size:17px;font-weight:500;max-width:38em}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);align-items:center;justify-content:flex-end}
.key span{display:inline-flex;align-items:center;gap:7px}
.kroom{width:24px;height:16px;border-radius:3px;background:var(--z0)}
.kcare{width:24px;height:16px;border-radius:3px;border:1.5px solid var(--z2);
  background:repeating-linear-gradient(135deg,transparent 0 4px,var(--z2) 4px 5.5px)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--track)}
.dots i.f{background:currentColor}

/* the building */
.plan{display:grid;gap:3px;background:var(--ink);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.wing{display:flex;flex-direction:column;gap:2px;background:var(--ink);min-width:0}
.wing h2{margin:0;padding:8px 13px;background:var(--z);color:var(--on);font-size:14.5px;font-weight:700;line-height:1.35}
.rooms{flex:1;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:1fr;gap:2px}
.room{position:relative;border:0;border-radius:0;background-color:var(--zs);padding:12px 12px 11px;min-height:104px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;min-width:0}
.room.care{background-image:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--z) 20%,transparent) 10px 11.5px)}
.room .pic{width:34px;height:34px;font-size:20px}
.room .nm{font-weight:700;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.room .dots{margin-top:auto;color:var(--z)}
.room .lock{position:absolute;right:11px;bottom:10px;font-size:16px;color:var(--z)}
.room .tr{position:absolute;top:11px;right:11px;display:flex;gap:5px;align-items:center}
.room .who{display:none;gap:3px}
.room.lit .who{display:inline-flex}
.room .cnt{height:24px;min-width:28px;padding:0 9px;border-radius:12px;background:var(--on);color:var(--z);
  font-family:var(--f-num);font-size:17px;font-weight:700;line-height:24px;text-align:center;display:none;font-variant-numeric:tabular-nums}
.room:hover{background-color:var(--sheet)}
.room.lit,.room.lit:hover,.room.sel,.room.sel:hover{background-color:var(--z);background-image:none;color:var(--on)}
.room.lit .pic,.room.sel .pic{background:var(--on);color:var(--z)}
.room.lit .dots,.room.lit .lock,.room.sel .dots,.room.sel .lock{color:var(--on)}
.room.lit .dots i:not(.f),.room.sel .dots i:not(.f){background:var(--on);opacity:.32}
.room.lit .cnt{display:block}
.room.mate .cnt{display:block;background:var(--z);color:var(--on)}
.room.dim>*{opacity:.5}
.room.outside{background-color:var(--sheet);box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3.5px var(--z)}
.mini{display:flex;flex-wrap:wrap;gap:2px;max-width:92px}
.mini i{width:7px;height:7px;border-radius:1.5px;background:var(--z);opacity:.6}
.mini i.x{background:transparent;box-shadow:inset 0 0 0 1px var(--z)}
.room.lit .mini i,.room.sel .mini i{background:var(--on)}
.room.lit .mini i.x,.room.sel .mini i.x{background:transparent;box-shadow:inset 0 0 0 1px var(--on)}
/* three ways to look at the same building */
.viewbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.vcap{font-size:13.5px;color:var(--muted);flex:1 1 280px}
.alt{--z:var(--ink);--zs:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:16px 12px;overflow-x:auto;
  background-color:var(--sheet);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px}
.alt[hidden],.plan[hidden],.viewbar[hidden]{display:none}
svg.rel{display:block;margin:0 auto}
.rn{cursor:pointer}
.rn rect.rb{fill:var(--zs);stroke:var(--z);stroke-width:1.6}
.rn rect.rp{fill:var(--z)}
.rn .ri{fill:none;stroke:var(--on);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rn text{font-family:var(--f-text);font-size:13px;font-weight:700;fill:var(--ink)}
.rn.sel rect.rb{fill:var(--z)} .rn.sel rect.rp{fill:var(--on)} .rn.sel .ri{stroke:var(--z)} .rn.sel text{fill:var(--on)}
.rn.ext rect.rb{fill:var(--sheet);stroke-dasharray:5 4}
.rn.dim{opacity:.3}
.rn:focus-visible rect.rb{stroke:var(--ink);stroke-width:3}
.re{fill:none;stroke:var(--ink);opacity:.34}
.re.on{opacity:.9}
.re.up{stroke:var(--warn);stroke-dasharray:6 4;opacity:.95}
.rah{fill:var(--ink)} .rahu{fill:var(--warn)}
.rlone{font-family:var(--f-text);font-size:12px;fill:var(--muted)}
.rsep{stroke:var(--hair);stroke-dasharray:4 5}
.fn.link{cursor:pointer}
/* a diagram opens up one box: what is inside sits on a tinted floor that carries the box's name, what it
   connects to stands outside the floor, at the two ends */
.fframe{fill:var(--zs);stroke:var(--zs);stroke-width:14;stroke-linejoin:round}
.alt .fframe{fill:var(--track);stroke:var(--track)}
.ftitle{font-family:var(--f-text);font-size:12.5px;font-weight:700;fill:var(--z)}
.alt .ftitle{fill:var(--muted)}
.fcap{font-family:var(--f-text);font-size:12px;fill:var(--muted)}
.fn.port rect.fb{fill:var(--zs)} .fn.port .fl{font-size:13px}
.fn.port:not(.link) rect.fb{fill:var(--paper);stroke:var(--ink)} .fn.port:not(.link):not(.ext) rect.fp{fill:var(--ink)}
.fn.sel rect.fb{fill:var(--z)} .fn.sel rect.fp{fill:var(--on)} .fn.sel .fi{stroke:var(--z)} .fn.sel .fl,.fn.sel .fnote{fill:var(--on)}
.fn.link:focus-visible rect.fb{stroke-width:3.5}
.fbadge rect{fill:var(--z);stroke:var(--sheet);stroke-width:2}
.fbadge text{font-family:var(--f-num);font-size:14px;font-weight:700;fill:var(--on)}
/* what goes into a box and what comes out, as drawn on the diagrams outside it */
.io{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:start}
.iot{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:5px;white-space:nowrap}
.pchip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--zs);border-radius:8px;padding:4px 11px 4px 4px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;max-width:100%}
.pchip .pic{width:24px;height:24px;font-size:15px;border-radius:6px}
.pchip .pl{font-weight:500;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pchip.plain{background:var(--paper);cursor:default;box-shadow:inset 0 0 0 1.5px var(--hair);padding-left:11px}
.pchip.plain .pic{background:var(--ink)}
.pchip.open{background:none;outline:1.5px dashed var(--warn);outline-offset:-1.5px}
.iokey{font-size:12.5px;color:var(--warn);display:flex;gap:7px;align-items:center}
.iokey i{display:inline-block;width:24px;height:14px;border-radius:4px;border:1.5px dashed var(--warn);flex:none}
.crumbs{display:flex;flex-wrap:wrap;gap:1px 7px;align-items:center;font-size:14px;line-height:1.3}
.crumbs i{font-style:normal;opacity:.7}
.wires{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 14px;font-size:13px;align-items:baseline}
.fn.plain rect.fb{stroke:var(--ink)} .fn.plain rect.fp{fill:var(--ink)}
.fe.loose{stroke-dasharray:6 5}
.rchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.follow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.follow.under{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--hair)}
.follow .rchips{margin-top:0} .follow .iot{padding-top:0}
.routebox{margin-top:14px;overflow-x:auto}
.rchips button{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:3px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.rchips button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.undernote{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.undernote b{font-weight:600;color:var(--ink)}
/* the rooms inside a room */
.blkhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.inplan{display:flex;flex-wrap:wrap;gap:2px;background:var(--ink);border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.sroom{flex:1 1 168px;min-width:0;border:0;background:var(--zs);padding:10px 11px;text-align:left;cursor:pointer;display:grid;
  grid-template-columns:26px minmax(0,1fr);gap:4px 9px;align-items:center}
.sroom .pic{width:26px;height:26px;font-size:16px;border-radius:6px}
.sroom .nm{font-weight:700;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.sroom .sm{grid-column:2;display:flex;gap:8px;align-items:center;font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--z);font-variant-numeric:tabular-nums}
.sroom:hover{background:var(--sheet)}
.sroom.ext{background:var(--sheet);box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3.5px var(--z)}
.sroom.lit,.sroom.lit:hover{background:var(--z);color:var(--on)}
.sroom.lit .pic{background:var(--on);color:var(--z)} .sroom.lit .sm{color:var(--on)}
.sroom.lit .dots i:not(.f){background:var(--on);opacity:.32}
.tagx{font-family:var(--f-text);font-size:11.5px;font-weight:700;border:1.5px solid currentColor;border-radius:5px;padding:0 6px;line-height:17px;white-space:nowrap}
.crumb{background:none;border:0;padding:0;font-size:14px;font-weight:600;color:inherit;opacity:.85;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.out-line{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14.5px}
.out-line .ic{font-size:18px}
/* a window: one Claude Code or Codex session, marked like a line on a transit map */
.wb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;flex:none;
  background:var(--ink);color:var(--paper);font-family:var(--f-num);font-size:14.5px;font-weight:700;line-height:1}
.wb.q{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--muted)}
.room .wb{box-shadow:0 0 0 1.5px var(--on)}
.room .wb.q{color:var(--on);box-shadow:inset 0 0 0 1.5px var(--on)}
.room .more{font-family:var(--f-num);font-size:14px;font-weight:700}

/* what is being worked on: tasks from the journal the agent keeps, shown in the lines it wrote there for people */
.tasks{display:flex;flex-direction:column;gap:10px}
.tasks[hidden]{display:none}
.thd{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.thd h2{font-size:21px;font-weight:900;margin:0}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;cursor:pointer;background:var(--sheet);
  border:1.5px solid var(--hair);border-radius:12px;padding:13px 14px 12px}
.tcard:hover{border-color:var(--ink)}
.tcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 5px 0 0 var(--ink)}
.tt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tn{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.tnow{font-size:14px;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.tnow.none{color:var(--muted)}
.tf{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center;margin-top:auto;font-size:12.5px;color:var(--muted)}
.tpics{display:inline-flex;gap:3px}
.tpics .pic{width:22px;height:22px;font-size:14px;border-radius:6px}
.flag.me{background:var(--warn);color:var(--on)}
.tline{font-size:17px;font-weight:500;line-height:1.55;max-width:44em}
.flag.fin{color:var(--muted);border-color:var(--muted)}
/* what a finished step came to: three short answers, then the flow diagrams with the changed boxes marked */
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1.5px;background:var(--hair);border:1.5px solid var(--hair);border-radius:10px;overflow:hidden}
.three>div{background:var(--sheet);padding:12px 14px 13px;min-width:0;display:flex;flex-direction:column;gap:4px}
.three h3{font-size:12.5px;font-weight:700;color:var(--muted);margin:0;letter-spacing:.04em}
.three p{margin:0;font-size:15px;line-height:1.55}
.chgh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.chgh .crumb{font-size:16px;font-weight:700;opacity:1}
svg.flow.marked .fn:not(.mk){opacity:.5}
.fn.mk rect.fb{stroke-width:3.5}
.fmk rect{fill:var(--z1)} .fmk.chg rect{fill:var(--warn)}
.fmk text{font-family:var(--f-text);font-size:11px;font-weight:700;fill:var(--on)}
.mkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.mk-b{display:inline-block;font-size:11px;font-weight:700;line-height:18px;padding:0 8px;border-radius:9px;color:var(--on);background:var(--z1);white-space:nowrap}
.mk-b.chg{background:var(--warn)} .mk-b.gone{background:none;color:var(--muted);border:1.5px dashed var(--muted);line-height:15px}
.mk-b.off{background:none;color:var(--muted);border:1.5px solid var(--hair);line-height:15px}
.chgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px 24px;margin:0;padding:0;list-style:none}
.chgs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 9px;align-items:baseline;font-size:14.5px;line-height:1.5}
.chgs b{font-weight:700} .chgs .gone b{text-decoration:line-through;color:var(--muted)}
.chgs span.tx{grid-column:2}

/* the sheet for what is picked */
.stage{border:3px solid var(--ink);border-radius:12px;background:var(--sheet);overflow:hidden;scroll-margin-top:14px}
.band{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 18px;background:var(--ink);color:var(--paper)}
.band.wingc{background:var(--z);color:var(--on)}
.band .pic{width:46px;height:46px;font-size:27px;border-radius:10px;background:var(--on);color:var(--z)}
.band h2{margin:0;font-size:23px;font-weight:900;line-height:1.2}
.band .meta{font-family:var(--f-num);font-size:16px;font-weight:600;opacity:.9;font-variant-numeric:tabular-nums}
.band .what{flex:1 1 280px;font-size:15.5px;font-weight:500;max-width:40em}

.band code{background:transparent;border-color:currentColor;color:inherit}
.band .back{margin-left:auto;background:none;border:1.5px solid currentColor;border-radius:999px;padding:3px 14px;font-size:13px;font-weight:600;cursor:pointer;color:inherit}
.body{padding:18px;display:flex;flex-direction:column;gap:18px}
h3{font-size:13.5px;font-weight:700;margin:0;color:var(--muted)}
.blk{display:flex;flex-direction:column;gap:8px;min-width:0}
.care-line{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14.5px;color:var(--warn)}
.care-line .ic{font-size:18px}
.canvas{border:1.5px solid var(--hair);border-radius:10px;padding:16px 12px;overflow-x:auto;
  background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px}
svg.flow{display:block;margin:0 auto}
.fn rect.fb{fill:var(--sheet);stroke:var(--z);stroke-width:2}
.fn.ext rect.fb{stroke:var(--ink);stroke-dasharray:6 4}
.fn rect.fp{fill:var(--z)}
.fn.ext rect.fp{fill:var(--ink)}
.fn .fi{fill:none;stroke:var(--on);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fn .fl{font-family:var(--f-text);font-size:14px;font-weight:700;fill:var(--ink)}
.fn .fnote{font-family:var(--f-text);font-size:11.5px;fill:var(--muted)}
.fe{fill:none;stroke:var(--ink);stroke-width:1.8;opacity:.72}
.fah{fill:var(--ink)}
.felbg{fill:var(--sheet);stroke:var(--hair);stroke-width:1}
.fel{font-family:var(--f-text);font-size:12px;font-weight:600;fill:var(--ink)}
.fdot{fill:var(--z)}
.fkey{font-size:12.5px;color:var(--muted)}
.aged{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center}
.aged.much{color:var(--warn);font-weight:600}
.aged .ic{font-size:15px}
.ask{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}

  // ---- who uses whom ----
  // Parts in bands. A part that mostly uses others sits high; a part that is mostly used sits low. The measure
  // is use going out over all use touching the part, so one stray import cannot move a part. Most arrows then
  // point down. The ones worth a look are drawn in the warning colour: two parts that use each other, and a
  // part low down that leans on one higher up.
  function mutuals(units,links){var w={},out=[];links.forEach(function(e){w[e.a+'\n'+e.b]=e.n;});
    links.forEach(function(e){var back=w[e.b+'\n'+e.a]||0;if(e.a<e.b&&Math.min(e.n,back)>=2&&Math.min(e.n,back)*4>=Math.max(e.n,back))out.push([e.a,e.b,Math.min(e.n,back)]);});
    return out.sort(function(x,y){return y[2]-x[2];});}
  function relSvg(units,links,sel,avail){
    var NW=156,NH=46,GX=12,GY=58,PAD=14,LEFT=0,idx={},w={},use={},used={},pairs=[],maxN=1;
    avail=Math.max(300,avail||900);
    units.forEach(function(u,i){idx[u.name]=i;});
    links.forEach(function(e){var a=idx[e.a],b=idx[e.b];if(a==null||b==null)return;w[a+'>'+b]=e.n;use[a]=(use[a]||0)+e.n;used[b]=(used[b]||0)+e.n;maxN=Math.max(maxN,e.n);});
    var band=units.map(function(_,i){var o=use[i]||0,n=used[i]||0;return o+n?Math.min(3,Math.floor(4*o/(o+n))):-1;}); // 3 mostly uses, 0 mostly used
    Object.keys(w).forEach(function(k){var q=k.split('>'),a=+q[0],b=+q[1],back=w[b+'>'+a]||0;
      if(w[k]>back||(w[k]===back&&a<b)){var e={a:a,b:b,n:w[k],back:back};
        e.two=back>=2&&back*4>=e.n;
        e.real=e.n>=2&&e.n*12>=use[a];               // more than a stray import
        e.hot=e.two||(e.real&&band[a]<band[b]);      // a part low down leaning on one higher up
        pairs.push(e);}});
    pairs.sort(function(x,y){return y.n-x.n;});
    var per=Math.floor((avail-PAD*2+GX)/(NW+GX));
    if(per<2){per=2;NW=Math.floor((avail-PAD*2-GX)/2);}
    var pos=[],y=PAD+18,rows=0;
    function place(row){for(var k=0;k<row.length;k+=per){var line=row.slice(k,k+per),x=(avail-(line.length*NW+(line.length-1)*GX))/2;
      line.forEach(function(i){pos[i]={x:x,y:y,cx:x+NW/2};x+=NW+GX;});y+=NH+26;}}
    for(var L=3;L>=0;L--){var row=[];units.forEach(function(_,i){if(band[i]===L)row.push(i);});if(!row.length)continue;place(row);y+=GY-26;rows++;}
    var lastY=y-GY,lone=[],sepY=0;units.forEach(function(_,i){if(band[i]<0)lone.push(i);});
    if(lone.length){y+=22;sepY=y-GY/2+10;y+=22;place(lone);y+=GY-26;}
    var VH=y-GY+PAD+(lone.length?6:26),si=sel!=null&&idx[sel]!=null?idx[sel]:-1,near={},shown=[];
    if(si>=0)pairs.forEach(function(e){if(e.a===si||e.b===si){shown.push(e);near[e.a]=near[e.b]=true;}});
    else if(per>3){var given={},hot=0;pairs.forEach(function(e){if(e.hot){if(hot++<6)shown.push(e);return;}if(!e.real)return;given[e.a]=(given[e.a]||0)+1;if(given[e.a]<=2)shown.push(e);});}
    function head(id,cls){return '<marker id="'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="'+cls+'" d="M0,0 L10,5 L0,10 z"/></marker>';}
    var s='<svg class="rel" width="'+avail+'" height="'+VH+'" viewBox="0 0 '+avail+' '+VH+'" role="img" aria-label="'+esc(links.slice(0,40).map(function(e){return e.a+' → '+e.b;}).join('；'))+'"><defs>'+head('rah','rah')+head('rahu','rahu')+'</defs>';
    if(rows>1)s+='<text class="rlone" x="'+PAD+'" y="'+(PAD+6)+'">'+esc(T.relTop)+'</text><text class="rlone" x="'+PAD+'" y="'+(lastY+36)+'">'+esc(T.relBottom)+'</text>';
    if(sepY)s+='<line class="rsep" x1="'+PAD+'" x2="'+(avail-PAD)+'" y1="'+sepY+'" y2="'+sepY+'"/><text class="rlone" x="'+PAD+'" y="'+(sepY+16)+'">'+esc(T.lone)+'</text>';
    shown.forEach(function(e){var a=pos[e.a],b=pos[e.b],d,m=e.hot?'rahu':'rah';
      if(Math.abs(a.y-b.y)<1){ // side by side: an arc under the row
        var dip=a.y+NH+14+Math.min(16,Math.abs(a.cx-b.cx)/16);
        d='M'+a.cx+','+(a.y+NH+(e.two?3:0))+' C'+a.cx+','+dip+' '+b.cx+','+dip+' '+b.cx+','+(b.y+NH+3);
      }else{var down=a.y<b.y,y1=down?a.y+NH+(e.two?3:0):a.y-(e.two?3:0),y2=down?b.y-3:b.y+NH+3,my=(y1+y2)/2,bow=0;
        if(Math.abs(y2-y1)>NH+GY&&Math.abs(a.cx-b.cx)<NW*0.7)bow=(a.cx<avail/2?-1:1)*(NW/2+26); // past a row in the same column: swing round it
        d='M'+a.cx+','+y1+' C'+(a.cx+bow)+','+my+' '+(b.cx+bow)+','+my+' '+b.cx+','+y2;}
      s+='<path class="re'+(si>=0?' on':'')+(e.hot?' up':'')+'" stroke-width="'+(1.1+2.4*Math.sqrt(e.n/maxN)).toFixed(1)+'" d="'+d+'" marker-end="url(#'+m+')"'+(e.two?' marker-start="url(#'+m+')"':'')+'/>';});
    units.forEach(function(u,i){var q=pos[i],lab=wrap(u.name,13,NW-54,2);
      s+='<g class="rn '+u.z+(i===si?' sel':'')+(si>=0&&i!==si&&!near[i]?' dim':'')+(u.external?' ext':'')+'" data-node="'+esc(u.name)+'" tabindex="0" role="button"><title>'+esc(u.name)+'</title>'+
        '<rect class="rb" x="'+q.x+'" y="'+q.y+'" width="'+NW+'" height="'+NH+'" rx="9"/><rect class="rp" x="'+(q.x+8)+'" y="'+(q.y+8)+'" width="30" height="30" rx="7"/>'+
        '<g transform="translate('+(q.x+13)+','+(q.y+13)+') scale(.83)"><path class="ri" d="'+(ICONS[u.icon]||ICONS.box)+'"/></g>';
      lab.forEach(function(t,k){s+='<text x="'+(q.x+46)+'" y="'+(q.y+(lab.length===1?28:20)+k*16)+'">'+esc(t)+'</text>';});
      s+='</g>';});
    return s+'</svg>';
  }

  function home(k){
    unselRows();setHash('');curFlow=null;curPart=null;curInner=null;curWin=(k==null||!multi)?null:k;

    if(!hasPending){light({},null);setStage('<div class="band"><h2>'+T.none+'</h2></div>');return;}
    var src=curWin==null?D.pending.parts.map(function(x){return {name:x.part,n:x.n,files:x.files};}):WIN[curWin].parts;
    var list=src.map(function(x){return {name:x.name,n:x.n,files:x.files};}),map={};
    list.forEach(function(x){if(byName[x.name])map[x.name]=x.n;});
    light(map,null,multi?(curWin==null?WIN:[WIN[curWin]]):null);
    var meta=landedText(list);
    if(multi&&curWin==null&&known.length)meta+=T.sep+f(T.nWin,{w:known.length});
    else if(!multi&&known.length)meta+=T.sep+f(T.fromOne,{t:winName(known[0])});
    // files that no part owns: say what that means and the sentence that puts them on the map
    var askList=list.some(function(x){return !byName[x.name];})?'<div class="ask">'+T.askList+'<span class="say">'+esc(T.sayList)+'</span></div>':'';
    setStage('<div class="band"><h2>'+(curWin==null?T.pending:wb(WIN[curWin])+' '+esc(winName(WIN[curWin])))+'</h2><span class="meta">'+meta+'</span></div><div class="body">'+
      (multi?lanes():'')+stackBar(list)+legend(list)+askList+'</div>');
  }
  // A part nobody has drawn yet still has a picture: who uses it and whom it uses, taken from the measured links.
  function around(u,links,find){
    var ins={},outs={},names=[];
    links.forEach(function(x){if(x.a===u.name&&find(x.b))outs[x.b]=x.n;if(x.b===u.name&&find(x.a))ins[x.a]=x.n;});
    Object.keys(ins).concat(Object.keys(outs)).forEach(function(k){if(names.indexOf(k)<0)names.push(k);});
    if(!names.length)return null;
    function size(k){return Math.max(ins[k]||0,outs[k]||0);}
    names.sort(function(x,y){return size(y)-size(x);});
    var left=[],right=[],edges=[];
    names.forEach(function(k){var user=(ins[k]||0)>=(outs[k]||0),side=user?left:right;if(side.length>=4)return;side.push({name:k,note:'',icon:'',ext:false});
      edges.push({a:user?k:u.name,b:user?u.name:k,label:f(T.nf,{n:size(k)}),both:!!(ins[k]&&outs[k])});});
    return {nodes:left.concat([{name:u.name,note:'',icon:u.icon,ext:false}],right),edges:edges};
  }
  // What goes into a box and what comes out: every arrow that some diagram outside the box draws to or from it.
  // One the level above draws, and the box's own diagram does not show, is a line with a loose end: drawn dashed.
  function portsBlock(u){var ps=u.ports||[];if(!ps.length)return '';
    function loose(x){return x.must&&x.met===false;}
    function chip(x){var t=x.to?byId(x.to):null,lab=x.labels.slice(0,2).join(T.sep)+(x.labels.length>2?' …':'');
      return (t?'<button type="button" class="pchip '+t.z+(loose(x)?' open':'')+'" data-to="'+esc(x.to)+'"':'<span class="pchip plain'+(loose(x)?' open':'')+'"')+
        ' title="'+esc(f(T.ioFrom,{w:x.where||T.frameName}))+'">'+(t?pic(t.icon):'')+'<span>'+esc(x.name)+'</span>'+(lab?'<span class="pl">'+esc(lab)+'</span>':'')+(t?'</button>':'</span>');}
    function row(dir,title){var l=ps.filter(function(x){return x.dir===dir;});if(!l.length)return '';
      l.sort(function(a,b){return (b.must?1:0)-(a.must?1:0);});
      return '<span class="iot">'+title+'</span><div class="pals">'+l.slice(0,10).map(chip).join('')+(l.length>10?'<span class="sub">'+f(T.more,{n:l.length-10})+'</span>':'')+'</div>';}
    return '<div class="blk"><h3>'+T.ioH+'</h3><div class="io">'+row('in',T.ioIn)+row('out',T.ioOut)+row('both',T.ioBoth)+'</div>'+
      (ps.some(loose)?'<div class="iokey"><i></i>'+T.ioOpen+'</div>':'')+'</div>';}
  function crumbs(list){return '<div class="crumbs">'+list.map(function(c){return '<button type="button" class="crumb" '+c[1]+'>'+esc(c[0])+'</button>';}).join('<i>›</i>')+'</div>';}
  function trail(u){ // the boxes this one sits in, outermost first: the project, its wing, its part
    var t=[[D.project,'data-go="home"']],top=u.parent?byName[u.parent]:u,w=u.wing==null?wingOf[top.name]:null;
    if(w)t.push([w.name,'data-to="w'+w.wing+'"']);
    if(u.parent)t.push([top.name,'data-to="p'+D.parts.indexOf(top)+'"']);
    return crumbs(t);}
  function flowBlock(u,links,find){
    curFlow=u.flow&&u.flow.nodes.length?u.flow:null;curOpt=linkOpt(u.wing!=null?null:u.name);curOpt.frame=curFlow&&opens(curFlow)?{title:u.name}:null;
    if(curFlow)return '<div class="blk"><h3>'+T.how+'</h3><div class="canvas" id="canvas"></div>'+
      (curOpt.frame&&curFlow.nodes.some(function(n){return n.outer&&wiredIn(curFlow,n);})?'<div class="fkey">'+T.outKey+'</div>':'')+
      (curFlow.nodes.some(function(n){return n.ext;})?'<div class="fkey"><i></i>'+T.extKey+'</div>':'')+
      // a diagram is a description: say when it was drawn and how much the code has moved since
      (u.since?'<div class="aged'+(u.since>=8?' much':'')+'">'+(u.since>=8?ic('sign'):'')+'<span>'+f(u.since>=8?T.agedMuch:T.aged,{d:u.drawn,n:u.since})+'</span></div>':'')+'</div>';
    var ask='<div class="ask">'+T.ask+'<span class="say">'+esc(f(T.say,{n:u.name}))+'</span></div>'; // nobody has drawn it: how to ask
    curFlow=links&&links.length?around(u,links,find):null;curOpt.frame=null;
    if(curFlow)return '<div class="blk"><h3>'+T.aroundH+'</h3><div class="canvas" id="canvas"></div><div class="fkey">'+T.aroundNote+'</div>'+(u.external?'':ask)+'</div>';
    return '<div class="blk"><h3>'+T.how+'</h3><div class="empty">'+T.noFlow+'</div>'+(u.external?'':ask)+'</div>';
  }
  function wiredIn(flow,n){return flow.edges.some(function(e){return e.a===n.name||e.b===n.name;});}
  // Can the diagram be drawn as one opened box, with what it connects to standing at the two ends? Not when its
  // story runs from one outside box straight to another: those have no place at an end, so it is drawn as a plain
  // story, left to right.
  function opens(flow){var out={};flow.nodes.forEach(function(n){if(n.outer)out[n.name]=1;});
    return !flow.edges.some(function(e){return out[e.a]&&out[e.b];});}
  function chips(list,attr){return '<div class="pals">'+list.slice(0,8).map(function(x){
    return '<button type="button" class="pal '+x.u.z+'" '+attr(x.u)+' title="'+esc(f(T.nFiles,{n:x.n}))+'">'+pic(x.u.icon)+esc(x.u.name)+'<span class="pct">'+x.n+'</span></button>';}).join('')+
    (list.length>8?'<span class="sub">'+f(T.more,{n:list.length-8})+'</span>':'')+'</div>';}
  function usesBlocks(name,links,find,attr){ // measured: what this one imports, and what imports it
    function side(mine,other,title,none){var list=links.filter(function(x){return x[mine]===name&&find(x[other]);}).map(function(x){return {u:find(x[other]),n:x.n};});
      return '<div class="blk"><h3>'+title+'</h3>'+(list.length?chips(list,attr):'<p class="sub">'+none+'</p>')+'</div>';}
    return side('a','b',T.uses,T.noUses)+side('b','a',T.usedBy,T.noUsedBy);
  }
  function rulesBlock(u){
    var h='<div class="blk"><h3>'+T.rules+'</h3>';
    if(u.rules.length){
      var sign=function(r){var m=r.match(/^(.*?)[（(]([^（）()]*)[）)]\s*$/);return '<div class="sign">'+ic('sign')+'<span>'+rich(m?m[1]:r)+(m?'<span class="src">'+esc(m[2])+'</span>':'')+'</span></div>';};
      h+='<div class="signs">'+u.rules.slice(0,2).map(sign).join('')+'</div>';
      if(u.rules.length>2)h+='<details><summary>'+f(T.moreRules,{n:u.rules.length-2})+'</summary><div class="in signs">'+u.rules.slice(2).map(sign).join('')+'</div></details>';
    }else h+='<p class="sub">'+T.noRules+'</p>';
    return h+'</div>';
  }
  function codeRows(u){var rows=[],seen={};
    function add(text,code){if(!code||!code.length||seen[text])return;seen[text]=1;rows.push('<span>'+esc(text)+'</span><span>'+code.map(function(c){return '<code>'+esc(c)+'</code>';}).join(' ')+'</span>');}
    (u.ports||[]).forEach(function(x){add((x.dir==='in'?x.name+' → '+u.name:u.name+(x.dir==='both'?' ⇄ ':' → ')+x.name)+(x.labels.length?T.colon+x.labels[0]:''),x.code);});
    if(u.flow)u.flow.edges.forEach(function(e){add(e.a+(e.both?' ⇄ ':' → ')+e.b+(e.label?T.colon+e.label:''),e.code);});
    return rows.length?'<div class="in"><b>'+T.codeH+'</b><div class="wires">'+rows.join('')+'</div></div>':'';}
  function mutualRow(name,units,links){ // measured: the units this one and the code of which lean on each other
    var m=mutuals(units,links).filter(function(x){return x[0]===name||x[1]===name;});
    return m.length?'<div class="in"><b>'+T.mutual+'</b><span>'+m.map(function(x){return esc(x[0]===name?x[1]:x[0]);}).join(T.sep)+'</span></div>':'';}
  function pathsBlock(u,more){var code=codeRows(u),paths=u.paths&&u.paths.length?'<div class="in tags">'+u.paths.map(function(x){return '<code>'+esc(x)+'</code>';}).join('')+'</div>':'';
    return paths||code||more?'<div class="blk"><details><summary>'+T.forCoders+'</summary>'+paths+code+(more||'')+'</details></div>':'';}
  function marks(u){return (u.external?'<div class="out-line">'+ic('box')+'<span>'+esc(f(T.outsideLine,{w:u.external}))+'</span></div>':'')+
    (u.sensitive?'<div class="care-line">'+ic('lock')+'<span>'+esc(u.sensitive)+'</span></div>':'');}
  function selectPart(name){
    unselRows();var p=byName[name],map={};setHash('p'+D.parts.indexOf(p));curPart=p;selName=name;curInner=null;curWing=wingOf[name]?wingOf[name].wing:null;
    p.together.forEach(function(c){map[c.name]=c.pct+'%';});
    light(map,name);
    var h='<div class="band wingc">'+pic(p.icon)+'<div>'+trail(p)+'<h2>'+esc(p.name)+'</h2><span class="meta">'+f(T.partMeta,{n:p.files,d:D.recentDays,r:p.recent})+(p.outside?f(T.outsideMore,{n:p.outside}):'')+'</span></div><p class="what">'+rich(p.what)+'</p>'+backBtn()+'</div><div class="body">';
    h+=marks(p);
    var at=winsOn(p.name,known);
    if(at.length)h+='<div class="nowby">'+at.map(function(w){return wb(w)+'<span>'+esc(winName(w))+'</span>';}).join('')+'<span class="sub">'+T.nowBy+'</span></div>';
    h+=portsBlock(p)+flowBlock(p,D.links,function(n){return byName[n];});
    if(p.subs.length){ // the rooms inside this room
      h+='<div class="blk"><h3>'+T.inside+'</h3><div class="inplan">'+p.subs.map(function(c,i){return '<button type="button" class="sroom'+(c.external?' ext':'')+(c.pending?' lit':'')+'" data-sub="'+i+'">'+pic(c.icon)+
        '<span class="nm">'+esc(c.name)+'</span><span class="sm">'+c.files+(c.external?'<span class="tagx">'+T.outsideTag+'</span>':dots(c.recent))+'</span></button>';}).join('')+'</div>';
      h+='</div>';
    }
    h+='<div class="cols3">';
    if(D.measured.length)h+=usesBlocks(p.name,D.links,function(n){return byName[n];},function(u){return 'data-go="'+esc(u.name)+'"';});
    h+=rulesBlock(p)+'<div class="blk"><h3>'+T.pals+'</h3>';
    if(p.together.length)h+='<div class="pals">'+p.together.map(function(c){var q=byName[c.name];
      return '<button type="button" class="pal '+q.z+'" data-go="'+esc(c.name)+'">'+pic(q.icon)+esc(c.name)+'<span class="pct">'+c.pct+'%</span></button>';}).join('')+'</div>';
    else h+='<p class="sub">'+T.noPals+'</p>';
    h+='</div>'+pathsBlock(p,mutualRow(p.name,D.parts,D.links))+'</div></div>';

  }
  // A wing opened: how its parts work together, what goes in and out of it, and the parts themselves.
  function selectWing(i){
    var w=WINGS[i],ps=w.parts.map(function(k){return D.parts[k];}),names={};
    unselRows();setHash('w'+i);curPart=null;selName=null;curWing=i;curInner=null;light({},null);
    ps.forEach(function(p){names[p.name]=p;});
    var links=D.links.filter(function(x){return names[x.a]&&names[x.b];}),ask='<div class="ask">'+T.wingAsk+'<span class="say">'+esc(f(T.wingSay,{n:w.name}))+'</span></div>';
    var h='<div class="band wingc">'+pic(w.icon)+'<div>'+trail(w)+'<h2>'+esc(w.name)+'</h2><span class="meta">'+f(T.wingMeta,{k:ps.length,n:ps.reduce(function(a,p){return a+p.files;},0)})+'</span></div>'+
      (w.what?'<p class="what">'+rich(w.what)+'</p>':'')+backBtn()+'</div><div class="body">'+portsBlock(w);

      if(links.length){curInner={units:ps,links:links};h+='<div class="blk"><h3>'+T.aroundH+'</h3><div class="canvas" id="inner"></div><div class="fkey">'+T.wingRel+'</div>'+ask+'</div>';}

  function selectSub(pname,sname){

    unselRows();setHash('p'+D.parts.indexOf(p)+'.'+p.subs.indexOf(c));curPart=p;selName=pname;curInner=null;curWing=wingOf[pname]?wingOf[pname].wing:null;

  function selectWork(c,row){

  // ---- what is being worked on ----
  // A task comes from the journal the agent keeps for the next agent. The page takes two things from it: the
  // few lines the agent wrote there for people (its name, where it stands, what waits on the reader), and
  // where its work landed, which is measured from commits and uncommitted changes, not written by anyone.
  function taskRooms(t){ // committed and uncommitted work together, one row per part, in the order of the plan
    var n={},files={};
    t.parts.concat(t.pending).forEach(function(x){n[x.name]=(n[x.name]||0)+x.n;files[x.name]=(files[x.name]||[]).concat(x.files||[]);});
    var names=D.parts.map(function(p){return p.name;}).filter(function(k){return k in n;});
    Object.keys(n).forEach(function(k){if(names.indexOf(k)<0)names.push(k);});
    return names.map(function(k){return {name:k,n:n[k],files:files[k]};});
  }
  function taskWhen(t){var d=t.updated.slice(5);return t.finished?f(T.tDone,{d:d}):t.days>=14?f(T.tStale,{d:d,n:t.days}):f(T.tUpdated,{d:d});}
  function hasMade(t){return t.made.length||t.try||t.left.length||t.marks.length;}
  function madeBlock(t){ // what the last finished step came to, in the agent's words for people
    var cells=[[T.tMade,t.made],[T.tTry,t.try?[t.try]:[]],[T.tLeft,t.left]].filter(function(c){return c[1].length;});
    return cells.length?'<div class="three">'+cells.map(function(c){return '<div><h3>'+c[0]+'</h3>'+c[1].map(function(x){return '<p>'+esc(x)+'</p>';}).join('')+'</div>';}).join('')+'</div>':'';
  }
  function marksBlock(t){ // each part the marks name: its own flow diagram with the new and changed boxes marked
    taskFlows=[];if(!t.marks.length)return '';
    var order=[],by={};
    t.marks.forEach(function(m){var k=m.unit||m.room||m.part;if(!by[k]){by[k]=[];order.push(k);}by[k].push(m);});
    var h='<div class="blk"><h3>'+T.tChg+'</h3>';
    order.forEach(function(k,gi){
      var list=by[k],u=unitNamed(k),top=u?(u.parent||u.name):null,kind={},drawn=u&&u.flow&&u.flow.nodes.length;
      list.forEach(function(m){if(m.box&&m.kind!=='gone'&&m.drawn)kind[m.box]=m.kind;});
      h+='<div class="blk"><div class="chgh">'+(top?'<button type="button" class="crumb" data-go="'+esc(top)+'">'+esc(k)+'</button>':'<b>'+esc(k)+'</b>')+'</div>';
      if(drawn&&Object.keys(kind).length){
        var base=linkOpt(u.name),id='tflow-'+gi;
        taskFlows.push({id:id,flow:u.flow,opt:{cls:base.cls,icon:base.icon,attr:base.attr,dash:base.dash,mark:function(n){return kind[n.name]||'';}}});
        h+='<div class="canvas" id="'+id+'"></div><div class="mkey"><span class="mk-b">'+T.mNew+'</span><span class="mk-b chg">'+T.mChg+'</span><span class="mk-b gone">'+T.mGone+'</span><span>'+T.mSame+'</span></div>';
      }else if(u&&!drawn)h+='<p class="sub">'+T.mNoFlow+'</p>';
      h+='<ul class="chgs">'+list.map(function(m){
        var miss=m.box&&m.kind!=='gone'&&!m.drawn&&drawn;
        return '<li class="'+m.kind+'"><span class="mk-b '+m.kind+'">'+(m.kind==='new'?T.mNew:m.kind==='chg'?T.mChg:T.mGone)+'</span>'+(m.box?'<b>'+esc(m.box)+'</b>':'')+
          (m.text?'<span class="tx">'+esc(m.text)+'</span>':'')+(miss?'<span class="tx sub">'+T.mNoBox+'</span>':'')+'</li>';}).join('')+'</ul></div>';
    });
    return h+'<div class="fkey">'+T.tChgNote+'</div></div>';
  }
  function taskWins(t){return t.wins.map(winByKey).filter(function(w){return w;});}
  function selectTask(i){
    var t=TASKS[i],list=taskRooms(t),map={},wins=taskWins(t);
    unselRows();setHash('t'+i);curFlow=null;curPart=null;curInner=null;curTask=i;$('task-'+i).setAttribute('aria-pressed','true');
    unpick();
    list.forEach(function(x){if(byName[x.name])map[x.name]=x.n;});
    light(map,null,wins.length?wins:null);
    var h='<div class="band"><h2>'+esc(t.name)+'</h2><span class="meta">'+esc(taskWhen(t))+'</span>'+backBtn()+'</div><div class="body">';
    if(t.plain){
      h+='<p class="tline">'+esc(t.now)+'</p>';
      if(t.needs.length)h+='<div class="blk"><h3>'+T.tNeeds+'</h3><div class="signs">'+t.needs.map(function(x){return '<div class="sign">'+ic('user')+'<span>'+esc(x)+'</span></div>';}).join('')+'</div></div>';
      if(t.next)h+='<div class="blk"><h3>'+T.tNext+'</h3><p>'+esc(t.next)+'</p></div>';

    h+='<div class="blk"><h3>'+T.tRooms+'</h3>'+(list.length?stackBar(list)+legend(list):'<p class="sub">'+T.tNoRooms+'</p>')+'</div>';
    h+=marksBlock(t);
    if(t.finished){if(!hasMade(t))h+='<div class="ask">'+T.tAskMade+'<span class="say">'+esc(f(T.tSayMade,{n:t.name}))+'</span></div>';}
    else h+='<div class="ask">'+(t.plain?T.tAsk:T.tAskBare)+'<span class="say">'+esc(f(t.plain?T.tSay:T.tSayBare,{n:t.name}))+'</span></div>';
    setStage(h+'</div>');drawTaskFlows();
  }
  if(TASKS.length||D.tasksOld){
    var fin=TASKS.filter(function(t){return t.finished;}).length,doing=TASKS.length-fin;
    $('tasks').hidden=false;$('tasksh').textContent=fin?(doing?T.tasksH2:T.tasksH3):T.tasksH;
    var waitingOn=TASKS.filter(function(t){return t.needs.length&&!t.finished;}).length;
    $('tasksm').textContent=[doing?f(T.tasksN,{n:doing}):'',waitingOn?f(T.tasksWait,{k:waitingOn}):'',fin&&doing?f(T.tasksFin,{k:fin}):''].filter(function(x){return x;}).join(T.sep);
    TASKS.forEach(function(t,i){
      var b=document.createElement('button');b.type='button';b.className='tcard';b.id='task-'+i;b.setAttribute('aria-pressed','false');
      var rooms=taskRooms(t).filter(function(x){return byName[x.name];}).sort(function(x,y){return y.n-x.n;}).slice(0,6);
      b.innerHTML='<span class="tt"><span class="tn">'+esc(t.name)+'</span>'+(t.finished?'<span class="flag fin">'+T.finFlag+'</span>':t.needs.length?'<span class="flag me">'+f(T.needsFlag,{n:t.needs.length})+'</span>':'')+'</span>'+
        '<span class="tnow'+(t.plain||t.made.length?'':' none')+'">'+esc(t.finished&&t.made.length?t.made[0]:t.plain?t.now:t.made.length?t.made[0]:T.tBare)+'</span><span class="tf">'+
        (rooms.length?'<span class="tpics">'+rooms.map(function(x){var p=byName[x.name];return '<span class="pic '+p.z+'" title="'+esc(p.name)+'">'+ic(p.icon)+'</span>';}).join('')+'</span>':'')+
        taskWins(t).map(function(w){return wb(w);}).join('')+'<span>'+esc(taskWhen(t))+'</span></span>';
      b.addEventListener('click',function(){if(curTask===i)home();else selectTask(i);});
      $('tcards').appendChild(b);});
    if(D.tasksOld){$('taskso').hidden=false;$('taskso').textContent=f(T.tasksOld,{n:D.tasksOld});}
  }

  // ---- footprints ----
  $('workh').textContent=T.work;
  var wide=true;
  function strip(cells){var h='<span class="foot">',last=null;
    D.parts.forEach(function(p){if(last!==null&&last!==p.group)h+='<span class="gap"></span>';last=p.group;h+=cells(p);});return h+'</span>';}
  function drawWork(){
    var tb=$('table');tb.innerHTML='';
    var head=document.createElement('div');head.className='thead';
    head.innerHTML='<span></span>'+strip(function(p){return '<span class="cell '+p.z+'" title="'+esc(p.name)+'">'+ic(p.icon)+'</span>';})+'<span></span>';
    tb.appendChild(head);
    var list=D.commits.filter(function(c){return !wide||c.parts.length>=2;}).slice(0,12);
    if(!list.length){var e=document.createElement('p');e.className='sub';e.style.padding='10px';e.textContent=T.noWork;tb.appendChild(e);return;}
    list.forEach(function(c,i){
      var n={};c.parts.forEach(function(x){n[x.name]=x.n;});
      var r=document.createElement('button');r.type='button';r.className='trow';r.id='work-'+i;
      r.innerHTML='<span class="d">'+c.date.slice(5)+'</span>'+strip(function(p){return '<span class="cell '+p.z+(n[p.name]?' t'+(n[p.name]===1?' one':''):'')+'" title="'+esc(p.name)+(n[p.name]?' '+n[p.name]:'')+'"></span>';})+'<span class="s">'+esc(c.subject)+'</span>';
      r.addEventListener('click',function(){selectWork(c,r);});
      tb.appendChild(r);
    });
  }
  [['wide',true],['all',false]].forEach(function(o){
    var b=document.createElement('button');b.type='button';b.id='seg-'+o[0];b.textContent=T[o[0]];b.setAttribute('aria-pressed',String(o[1]===wide));
    b.addEventListener('click',function(){wide=o[1];Array.prototype.forEach.call($('seg').children,function(x){x.setAttribute('aria-pressed',String(x===b));});drawWork();});
    $('seg').appendChild(b);
  });
  drawWork();
  var m=/^#p(\d+)(?:\.(\d+))?$/.exec(location.hash||''),hp=m&&D.parts[+m[1]];
  var mt=/^#t(\d+)$/.exec(location.hash||''),mw=/^#w(\d+)$/.exec(location.hash||'');
  if(view!=='plan')setView(view);
  if(hp&&m[2]&&hp.subs[+m[2]])selectSub(hp.name,hp.subs[+m[2]].name);else if(hp)selectPart(hp.name);else if(mw&&WINGS[+mw[1]])selectWing(+mw[1]);else if(mt&&TASKS[+mt[1]])selectTask(+mt[1]);else home();
  quiet=false;
})();
</script>
